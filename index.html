<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>دفتر مصاريفي</title>
<meta name="description" content="تابع مرتبك والتزاماتك ومدخراتك أول بأول" />
<meta name="theme-color" content="#1F4D3E" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="دفتر مصاريفي" />
<link rel="icon" href="icon-192.png" />
<style>
  html, body { margin: 0; padding: 0; background: #F3ECD8; }
  #root { min-height: 100vh; }
  body { font-family: 'Amiri', 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif; }
</style>
<!-- Optional decorative fonts. If this network blocks Google Fonts, the app
     still works fully — it just falls back to the system font above. -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<!-- Everything the app needs (React + ReactDOM + app code) is bundled into
     this one local file — no CDN / internet dependency to run the app. -->
<script src="app.bundle.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
